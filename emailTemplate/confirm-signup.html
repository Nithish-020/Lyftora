<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="color-scheme" content="light" />
<meta name="supported-color-schemes" content="light" />
<title>Lyftora — verify your email</title>
<!--[if mso]>
<style type="text/css">
  body, table, td, p, a, span { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
<style type="text/css">
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  body { margin:0; padding:0; background:#EAE4D5; }
  a { text-decoration:none; }
  @media screen and (max-width: 600px) {
    .container { width:100% !important; }
    .px-outer { padding-left:16px !important; padding-right:16px !important; }
    .px-inner { padding-left:22px !important; padding-right:22px !important; }
    .hero-size { font-size:40px !important; line-height:0.98 !important; letter-spacing:-1.1px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#EAE4D5;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">

<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#EAE4D5;opacity:0;">
  Your Lyftora verification code is inside.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EAE4D5;">
  <tr>
    <td class="px-outer" align="center" style="padding:36px 24px 56px 24px;">

      <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;">

        <tr>
          <td style="padding:0 6px 22px 6px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" valign="middle">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="display:inline-block;">
                    <tr>
                      <td valign="middle" style="padding-right:10px;">
                        <div style="width:10px;height:10px;background:#D6FF4D;border-radius:50%;box-shadow:0 0 0 3px rgba(214,255,77,0.40);display:inline-block;">&nbsp;</div>
                      </td>
                      <td valign="middle" style="font-family:'Instrument Serif',Georgia,serif;font-size:24px;letter-spacing:-0.3px;color:#0E0E12;line-height:1;">
                        lyftora
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="background:#F4EFE4;border:1px solid rgba(14,14,18,0.08);border-radius:28px;box-shadow:0 14px 26px -14px rgba(14,14,18,0.18);">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

              <tr>
                <td class="px-inner" align="center" style="padding:44px 40px 8px 40px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
                    <tr>
                      <td align="center" valign="middle" width="72" height="72" style="width:72px;height:72px;background:#EEFFB0;border:1.5px solid rgba(214,255,77,0.55);border-radius:36px;box-shadow:0 0 24px rgba(214,255,77,0.55);text-align:center;line-height:72px;">
                        <span style="font-family:'Instrument Serif',Georgia,serif;font-size:30px;color:#0E0E12;line-height:1;">✓</span>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td class="px-inner" align="center" style="padding:20px 40px 0 40px;">
                  <span style="font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:2px;color:#6B6A63;text-transform:uppercase;font-weight:500;">
                    VERIFY EMAIL
                  </span>
                </td>
              </tr>

              <tr>
                <td class="px-inner" align="center" style="padding:14px 40px 0 40px;">
                  <h1 class="hero-size" style="margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:46px;line-height:0.96;letter-spacing:-1.2px;color:#0E0E12;">
                    Check your <em style="font-style:italic;color:#FF5A3C;">inbox.</em>
                  </h1>
                </td>
              </tr>

              <tr>
                <td class="px-inner" align="center" style="padding:14px 40px 0 40px;">
                  <p style="margin:0;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#6B6A63;">
                    We sent a 6-digit code to
                  </p>
                  <p style="margin:4px 0 0 0;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;color:#0E0E12;font-weight:600;word-break:break-all;">
                    {{ .Email }}
                  </p>
                </td>
              </tr>

              <tr>
                <td class="px-inner" align="center" style="padding:30px 40px 0 40px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;background:rgba(214,255,77,0.32);border:1px solid rgba(214,255,77,0.55);border-radius:16px;">
                    <tr>
                      <td align="center" style="padding:20px 28px;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:32px;font-weight:700;letter-spacing:0.35em;color:#0E0E12;">
                        {{ .Token }}
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td class="px-inner" align="center" style="padding:18px 40px 0 40px;">
                  <span style="font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:1.6px;color:#A09F96;text-transform:uppercase;font-weight:500;">
                    Enter the code in the Lyftora app. Check spam if you don’t see this email.
                  </span>
                </td>
              </tr>

              <tr>
                <td class="px-inner" style="padding:30px 40px 40px 40px;">
                  <p style="margin:0;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6B6A63;">
                    If you didn’t try to create an account, you can ignore this message.
                  </p>
                </td>
              </tr>

            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:26px 10px 0 10px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" style="font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:11px;color:#6B6A63;">
                  © Lyftora
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
